name: mind_care_app
description: A mental health and wellness application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  http: ^1.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.18.1
  emoji_picker_flutter: ^1.6.3
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.4
  google_fonts: ^6.2.1
  audioplayers: ^5.2.0
  fl_chart: ^0.66.2
  table_calendar: ^3.0.9
  image_picker: ^1.0.7
  vibration: ^1.8.4
  geolocator: ^10.1.0
  permission_handler: ^11.3.1
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.6

# Add dependency overrides to force resolution
dependency_overrides:
  table_calendar: ^3.0.9
  intl: ^0.18.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/ 